<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening InternTrack</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #17233c; background: #f5f5ef; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { text-align: center; }
      strong { display: block; font-family: Georgia, serif; font-size: 2rem; font-weight: 500; }
      p { color: #687184; }
      .loader { width: 28px; height: 28px; margin: 24px auto; border: 3px solid #d9ddd7; border-top-color: #2f6f59; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main><strong>InternTrack</strong><div class="loader"></div><p>Opening your local workspace…</p></main>
  </body>
</html>

name: Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "alembic/**"
      - "frontend/**"
      - "desktop/**"
      - "requirements*.txt"
      - ".github/workflows/desktop.yml"

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-interntrack-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Build Python API sidecar
        shell: pwsh
        run: ./desktop/scripts/build_sidecar.ps1 -SkipFrontendInstall

      - name: Build NSIS installer
        run: pnpm --dir desktop exec tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: InternTrack-Windows-x64
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

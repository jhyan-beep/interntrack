name: Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "alembic/**"
      - "frontend/**"
      - "desktop/**"
      - "requirements*.txt"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"

jobs:
  build-windows-installer:
    # WebView2 automation currently regresses on Server 2025 (runner-images#14738).
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate desktop version files
        id: version
        shell: pwsh
        run: ./desktop/scripts/validate_release_version.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-interntrack-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt -r requirements-desktop-test.txt
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Test Windows parent lifetime monitoring
        run: python -m pytest tests/test_desktop_process.py -q

      - name: Build Python API sidecar
        shell: pwsh
        run: ./desktop/scripts/build_sidecar.ps1 -SkipFrontendInstall

      - name: Test desktop HTTP readiness
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc --lib

      - name: Build NSIS installer
        run: pnpm --dir desktop exec tauri build --target x86_64-pc-windows-msvc

      - name: Verify silent installer and installed runtime
        timeout-minutes: 8
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer." }
          ./desktop/scripts/smoke_installer.ps1 -InstallerPath $installers[0].FullName -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Upload desktop window diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InternTrack-Desktop-Smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/interntrack-desktop-smoke/*
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare beta installer package
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer." }
          $sourceCommit = git rev-parse HEAD
          $buildUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ./desktop/scripts/prepare_candidate.ps1 -InstallerPath $installers[0].FullName -OutputDirectory (Join-Path $env:RUNNER_TEMP "interntrack-beta") -Version "${{ steps.version.outputs.version }}" -SourceCommit $sourceCommit -BuildUrl $buildUrl

      - name: Upload Windows beta installer package
        uses: actions/upload-artifact@v4
        with:
          name: InternTrack-Windows-x64-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/interntrack-beta/*
          if-no-files-found: error


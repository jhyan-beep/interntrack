name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: interntrack
          POSTGRES_PASSWORD: interntrack
          POSTGRES_DB: interntrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interntrack -d interntrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://interntrack:interntrack@localhost:5432/interntrack_test
      ENVIRONMENT: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          alembic upgrade head
          alembic check
          pytest

      - name: Build web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Validate production operations files
        run: |
          sh -n ops/backup_postgres.sh
          sh -n ops/restore_postgres.sh
          PRODUCTION_ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f compose.production.yml config --quiet

      - name: Build production image as a non-root user
        run: |
          docker build -t interntrack:ci .
          docker run --rm --entrypoint sh interntrack:ci -c 'test "$(id -u)" -ne 0'


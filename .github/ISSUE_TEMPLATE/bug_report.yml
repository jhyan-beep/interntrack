name: Bug report
description: Report a reproducible problem with InternTrack.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve InternTrack. Do not include passwords, API keys, email content, or application notes.
  - type: input
    id: version
    attributes:
      label: InternTrack version
      description: Find this under Account settings → About & support.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Windows desktop app
        - Self-hosted web app
        - Local development
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that triggers the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Drag in the diagnostics JSON downloaded from About & support, if available.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, API keys, email content, and private application data.
          required: true


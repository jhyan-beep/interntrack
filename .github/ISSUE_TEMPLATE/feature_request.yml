name: Feature request
description: Suggest a focused improvement to InternTrack.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What part of your internship search is difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: Describe the smallest feature that would help.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often would you use this?
      options:
        - Every day
        - A few times per week
        - A few times per month
        - Occasionally
    validations:
      required: true


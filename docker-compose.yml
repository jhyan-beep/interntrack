services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: interntrack
      POSTGRES_PASSWORD: interntrack
      POSTGRES_DB: interntrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interntrack -d interntrack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
